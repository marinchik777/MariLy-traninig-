<style>
/* Layout: calendar-block aesthetic. Five switchable palettes, a script wordmark, soft rounded blocks, big month grid. */
:root{
  --bg:#FDFCF7; --paper:#FFFFFF; --soft:#F7F3E8; --line:#E7E0D2; --ink:#4B3935; --ink2:#85746D;
  --deep:#4B3935; --on-deep:#FFFFFF; --t1:#8E3B3B; --t2:#9FC5C9; --warn:#8E3B3B;
  --c0:#CBDFEA; --f0:#34454F; --c1:#C8C2BC; --f1:#3B3531; --c2:#708090; --f2:#FFFFFF; --c3:#4B3935; --f3:#FFFFFF;
  --c4:#FAF3E0; --f4:#5B4A44; --c5:#CBDFEA; --f5:#34454F; --c6:#C8C2BC; --f6:#3B3531; --c7:#708090; --f7:#FFFFFF;
  --panel:#4B3935; --on-panel:#FFFFFF;
  --mt-sun:#EDEDED; --mt-1:#DCDCDC; --mt-2:#A9A9A9; --mt-fc:#8C8C8C; --mt-sn:#FFFFFF; --mt-3:#151515;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif; --script:'Pinyon Script','Snell Roundhand','Brush Script MT',cursive;
  --sans:'Lora',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
:root[data-palette="forest"]{
  --bg:#FBFBF5; --paper:#FFFFFF; --soft:#F1F4EC; --line:#DDE3D6; --ink:#2F3D2B; --ink2:#6C7867;
  --deep:#394931; --on-deep:#FFFFFF; --t1:#8B3E3E; --t2:#546A50; --warn:#8B3E3E;
  --c0:#ADB6AB; --f0:#27331F; --c1:#7E8A6D; --f1:#1B2418; --c2:#546A50; --f2:#FFFFFF; --c3:#394931; --f3:#FFFFFF;
  --c4:#D5DFD3; --f4:#2F3D2B; --c5:#ADB6AB; --f5:#27331F; --c6:#7E8A6D; --f6:#1B2418; --c7:#546A50; --f7:#FFFFFF;
  --panel:#394931; --on-panel:#FFFFFF;
}
:root[data-palette="waves"]{
  --bg:#B0E4FC; --paper:#F4FBFF; --soft:#DDF3FD; --line:#BFE3F5; --ink:#1B2A6B; --ink2:#46609B;
  --deep:#3e59a1; --on-deep:#FFFFFF; --t1:#3340B4; --t2:#5493cb; --warn:#3340B4;
  --c0:#5493cb; --f0:#08203A; --c1:#9bd9f0; --f1:#0B2A44; --c2:#99f6ff; --f2:#0B2F3A; --c3:#b4c1ff; --f3:#1A2466;
  --c4:#aaceff; --f4:#10285A; --c5:#3e59a1; --f5:#FFFFFF; --c6:#4e5c96; --f6:#FFFFFF; --c7:#4e7abf; --f7:#FFFFFF;
  --panel:#3e59a1; --on-panel:#FFFFFF;
}
:root[data-palette="blush"]{
  --bg:#FFF7F5; --paper:#FFFFFF; --soft:#FDEEF0; --line:#F3D9DC; --ink:#5A2E26; --ink2:#9A6F69;
  --deep:#8B4A47; --on-deep:#FFFFFF; --t1:#5A2E26; --t2:#E58E96; --warn:#B14A57;
  --c0:#F7C9CF; --f0:#5A2E26; --c1:#E8788A; --f1:#3E1B1B; --c2:#FCE4E6; --f2:#6A3A36; --c3:#8B4A47; --f3:#FFFFFF;
  --c4:#D9A5A0; --f4:#3E1B1B; --c5:#F7C9CF; --f5:#5A2E26; --c6:#E8788A; --f6:#3E1B1B; --c7:#FCE4E6; --f7:#6A3A36;
  --panel:#8B4A47; --on-panel:#FFFFFF;
}
:root[data-palette="sand"]{
  --bg:#FAEBE3; --paper:#FFF7F2; --soft:#F5E1D5; --line:#E9CFC0; --ink:#5A4636; --ink2:#8C7261;
  --deep:#6D5646; --on-deep:#FFFFFF; --t1:#6D5646; --t2:#B58B73; --warn:#8C4A3A;
  --c0:#E8D3C4; --f0:#5A4636; --c1:#C9A58F; --f1:#3E2D22; --c2:#B58B73; --f2:#2B1E15; --c3:#6D5646; --f3:#FFFFFF;
  --c4:#F3E0D3; --f4:#5A4636; --c5:#E8D3C4; --f5:#5A4636; --c6:#C9A58F; --f6:#3E2D22; --c7:#B58B73; --f7:#2B1E15;
  --panel:#6D5646; --on-panel:#FFFFFF;
}
/* dark mode: same palette blocks, deep backgrounds taken from each palette */
:root[data-mode="dark"]{color-scheme:dark;--mt-sun:#CFCFCF;--mt-1:#303030;--mt-2:#4D4D4D;--mt-fc:#3A3A3A;--mt-sn:#F2F2F2;--mt-3:#0A0A0A}
:root[data-mode="dark"][data-palette="gray"]{--bg:#1D1817;--paper:#272120;--soft:#312A28;--line:#433A37;--ink:#F3EBDD;--ink2:#B7A9A2;--deep:#CBDFEA;--on-deep:#1D1817;--t1:#E3A3A3;--t2:#9FC5C9;--warn:#E3A3A3}
:root[data-mode="dark"][data-palette="forest"]{--bg:#131B12;--paper:#1B261A;--soft:#233122;--line:#33452F;--ink:#E4EBDD;--ink2:#A3B09C;--deep:#ADB6AB;--on-deep:#131B12;--t1:#DDA0A0;--t2:#9DBF98;--warn:#DDA0A0}
:root[data-mode="dark"][data-palette="waves"]{--bg:#0D1530;--paper:#151F45;--soft:#1B2858;--line:#2A3A75;--ink:#E8EEFF;--ink2:#A8B8E8;--deep:#9bd9f0;--on-deep:#0D1530;--t1:#99f6ff;--t2:#b4c1ff;--warn:#ffb4c1}
:root[data-mode="dark"][data-palette="blush"]{--bg:#281618;--paper:#331E21;--soft:#3F2529;--line:#553539;--ink:#FCE8EA;--ink2:#D4A9AE;--deep:#F7C9CF;--on-deep:#281618;--t1:#F7C9CF;--t2:#E8788A;--warn:#F7A4AE}
:root[data-mode="dark"][data-palette="sand"]{--bg:#231A14;--paper:#2E241D;--soft:#392D24;--line:#4D3E32;--ink:#F3E2D6;--ink2:#C0A897;--deep:#E8D3C4;--on-deep:#231A14;--t1:#E8CDB8;--t2:#C9A58F;--warn:#E8A892}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:italic 400 16px/1.5 var(--sans);
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.ic{width:1em;height:1em;display:block}
.shell{max-width:1160px;margin:0 auto;min-width:0}

/* header, top bar, side menu, mode switch, sign-in */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-top:26px}
.logo{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;line-height:1;font-weight:400}
.w1,.w3{font:italic 500 clamp(36px,8.4vw,76px)/1 var(--serif);letter-spacing:-.01em}
.w1{color:var(--t1)} .w3{color:var(--t2);margin:0 .05em}
.w2{font:400 clamp(52px,11.5vw,104px)/.8 var(--script);color:var(--t2);padding-right:.1em}
.tag{margin:8px 0 0;font:italic 400 16px/1.4 var(--serif);color:var(--t1);max-width:36ch}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:10px 0 18px;padding:8px 0;display:flex;align-items:center;gap:14px}
.burger{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:22px;color:var(--ink);flex:none}
.burger:hover{background:var(--soft)}
.bt{font:italic 500 clamp(22px,4.4vw,28px)/1.1 var(--serif);color:var(--t1);white-space:nowrap}
.rule{flex:1;height:1px;background:var(--line);min-width:20px}
.mode{position:relative;flex:none;width:72px;height:46px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 42%,transparent);background:transparent;padding:0;color:var(--ink2)}
.mode .knob{position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;transition:left .3s ease;
  background:radial-gradient(circle at 30% 36%,rgba(80,80,80,.5) 0 3px,transparent 4px),radial-gradient(circle at 63% 27%,rgba(80,80,80,.42) 0 4px,transparent 5px),radial-gradient(circle at 56% 67%,rgba(80,80,80,.48) 0 5px,transparent 6px),radial-gradient(circle at 25% 68%,rgba(80,80,80,.38) 0 3px,transparent 4px),radial-gradient(circle at 35% 30%,#F6F6F6,#C9C9C9 55%,#8E8E8E 100%);
  box-shadow:0 0 0 5px color-mix(in srgb,currentColor 9%,transparent),0 0 16px rgba(255,255,255,.28)}
.mode[aria-checked="false"] .knob{left:calc(100% - 40px);background:radial-gradient(circle at 35% 30%,#FFF8DC,#F6D98E 58%,#E2B25C 100%);box-shadow:0 0 0 5px color-mix(in srgb,currentColor 9%,transparent),0 0 16px rgba(240,190,90,.45)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,16,16,.48)}
.drawer{position:fixed;z-index:55;top:0;bottom:0;left:0;width:min(330px,86vw);background:var(--panel);color:var(--on-panel);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .26s ease,visibility 0s linear .26s;box-shadow:10px 0 34px rgba(0,0,0,.25)}
.drawer.open{transform:none;visibility:visible;transition:transform .26s ease}
.drawer .iconbtn{background:transparent;color:var(--on-panel);border-color:color-mix(in srgb,var(--on-panel) 40%,transparent)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dbrand{font:italic 500 25px/1.1 var(--serif)} .dbrand span{opacity:.72}
.dnav{display:flex;flex-direction:column;gap:4px}
.di{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--on-panel);text-decoration:none;font:italic 500 23px/1.15 var(--serif)}
.di:hover{background:color-mix(in srgb,var(--on-panel) 14%,transparent)}
.di[aria-current="page"]{background:var(--c0);color:var(--f0)}
.sq{width:12px;height:12px;border-radius:4px;display:block;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.dlab{margin:22px 0 8px;font:italic 400 15px var(--sans);opacity:.82;letter-spacing:.03em}
.dpal{display:flex;flex-direction:column;gap:6px}
.dp{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--on-panel) 32%,transparent);background:transparent;color:var(--on-panel);text-align:left;font:italic 500 17px var(--sans)}
.dp[aria-pressed="true"]{background:var(--on-panel);color:var(--panel)}
.dp .sw{display:flex}
.dp .sw i{width:12px;height:12px;border-radius:50%;margin-left:-3px;border:1px solid rgba(0,0,0,.22)}
.dp .sw i:first-child{margin-left:0}
.dmode{display:flex;align-items:center;gap:14px;font:italic 500 18px var(--sans)}
.dmail{margin:0 0 10px;overflow-wrap:anywhere}
.auth{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;align-items:flex-start}
.auth .box{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;margin-top:5vh}
.auth{padding-bottom:0}
.auth .box{position:relative;z-index:2;padding-bottom:230px}
.auth .hero2{display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
.auth .ribbon{display:flex;gap:6px;margin:2px 0 4px}
.auth .ribbon i{flex:1;height:12px;border-radius:5px;background:var(--bc)}
.auth .hello{margin:10px 0 0;font:italic 500 clamp(40px,11vw,56px)/1 var(--serif);color:var(--t1)}
.auth .lead{margin:0;font:italic 400 19px/1.55 var(--serif);color:var(--ink)}
.auth .lead b{font-weight:500;color:var(--t1)}
.auth .mtw{position:fixed;left:0;right:0;bottom:0;z-index:1;pointer-events:none}
.auth .mtw .mt{margin:0;width:100%;height:clamp(130px,26vw,220px)}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth h2{font:italic 500 28px/1.15 var(--serif);color:var(--t1);margin:6px 0 0}
.auth .ab{display:flex;flex-wrap:wrap;align-items:baseline}
.alinks{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}
.lnk{border:0;background:none;padding:6px 0;color:var(--t1);text-decoration:underline;font:inherit}
.amsg{margin:0;padding:10px 12px;border-radius:10px;background:var(--soft)}
.amsg.err{border:1px solid var(--warn);color:var(--warn);background:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--deep);color:var(--on-deep);padding:10px 16px;border-radius:12px;width:max-content;max-width:calc(100vw - 32px)}

/* shared pieces */
.mt{display:block;width:100vw;margin-left:calc(50% - 50vw);height:clamp(120px,24vw,230px);margin-top:36px}
.mt .sun{fill:var(--mt-sun)} .mt .m1{fill:var(--mt-1)} .mt .m2{fill:var(--mt-2)} .mt .fc{fill:var(--mt-fc)} .mt .sn{fill:var(--mt-sn)} .mt .m3,.mt g.m3{fill:var(--mt-3)}
body{padding-block-end:0;overflow-x:clip}

.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:500}
h2,h3{margin:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card>h2,.h2{font:italic 500 23px/1.2 var(--serif);color:var(--t1);margin:0 0 12px;text-wrap:balance}
.card h3{font:italic 500 12px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:14px 0 8px}
.small{font-size:13px;color:var(--ink2);margin:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:7px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--deep);background:var(--deep);color:var(--on-deep);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--deep)}
.btn.sm{padding:6px 12px;font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:16px;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--soft)}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;color:var(--ink)}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);min-width:0}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-size:15px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--deep);border-radius:99px}
.num{font-variant-numeric:tabular-nums}
.ring .tr{stroke:var(--line)} .ring .pr{stroke:var(--deep)} .ring text{fill:var(--ink);font:italic 500 18px var(--sans)}
.hero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;margin-bottom:20px}
.date{font:italic 500 clamp(28px,5vw,44px)/1.1 var(--serif);color:var(--t1);margin:0;text-transform:none}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:13px}
.chip b{font-weight:600;font-size:16px;color:var(--t1)}
.hero-r{display:flex;align-items:center;gap:14px}

/* colour blocks */
.blk{--bc:var(--c0);--fc:var(--f0);display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:9px 12px;border-radius:9px;border:1px solid color-mix(in srgb,var(--fc) 14%,transparent);background:var(--bc);color:var(--fc);font:italic 500 15px/1.25 var(--sans);text-align:left}
.blk .chk{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none;opacity:.55;font-size:15px}
.blk .chk .ic{opacity:0}
.blk.on .chk{background:var(--fc);color:var(--bc);opacity:1}
.blk.on .chk .ic{opacity:1}
.blk.on .nm{text-decoration:line-through;text-decoration-thickness:1px;opacity:.85}
.blk .sub{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:1px}
.gls{display:flex;flex-wrap:wrap;gap:6px}
.gl{width:38px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink2);display:grid;place-items:center;font-size:20px}
.gl.on{background:var(--c0);color:var(--f0);border-color:transparent}
.exrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;font-size:14.5px}
.exrow .chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink2);display:grid;place-items:center;flex:none;font-size:14px;color:transparent}
.exrow.on .chk{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.exrow.on .en{text-decoration:line-through;color:var(--ink2)}
.exrow .dose{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap;padding-left:8px}
.tagpill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;letter-spacing:.06em;background:var(--c0);color:var(--f0)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink)}

/* calendar */
.calhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.calhead h2{font:italic 500 clamp(28px,5vw,40px)/1 var(--serif);color:var(--t1);text-transform:capitalize}
.dowrow,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dowrow span{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:4px 0}
.cell{display:flex;flex-direction:column;gap:5px;text-align:left;min-height:84px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0;overflow:hidden}
.cell.out{opacity:.45}
.cell:hover{border-color:var(--deep)}
.cell .top2{display:flex;justify-content:space-between;align-items:center;gap:4px}
.cell .dn{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums}
.cell.today .dn{background:var(--t1);color:var(--bg);font-weight:600}
.cell .pc{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell .hl{display:none}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--bc)}
.hrow{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hrow i{width:9px;height:9px;border:1px solid var(--ink2);border-radius:2px;flex:none}
.hrow.on i{background:var(--bc);border-color:var(--bc)}
.hrow.on span{color:var(--ink2)}
@media (min-width:860px){
  .cell{min-height:168px;padding:8px}
  .cell .hl{display:flex;flex-direction:column;gap:0}
  .cell .dots{display:none}
}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--bc);display:block}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,25,25,.42);display:flex;justify-content:flex-end}
.sheet .panel{background:var(--bg);width:min(520px,100%);height:100%;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.sheet .ph{display:flex;align-items:center;gap:10px}

/* week table */
.scrollx{overflow-x:auto}
.formgrid{align-items:start}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:44px;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
input[type=date]::-webkit-datetime-edit{padding:0}
.formgrid>label.f{overflow:hidden}
.formgrid input,.formgrid select{min-width:0;width:100%;box-sizing:border-box}
.mrec{padding:10px 0;border-bottom:1px solid var(--line)}
.mrec:last-child{border-bottom:0}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mhd b{font:italic 500 16px var(--serif);color:var(--t1)}
.mvals{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.mvals i{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-right:4px}
.wt{display:grid;grid-template-columns:minmax(130px,1.5fr) repeat(7,minmax(38px,1fr)) 64px;gap:6px 4px;align-items:center;min-width:560px}
.wt .hd{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);line-height:1.2}
.wt .hd b{display:block;font:italic 500 15px var(--sans);letter-spacing:0;color:var(--ink)}
.wt .hd.today b{color:var(--t1)}
.wt .hn{font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.wt .hn i{width:12px;height:12px;border-radius:4px;background:var(--bc);flex:none}
.wt .hn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotb{justify-self:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;color:transparent;font-size:15px}
.dotb.on{background:var(--bc);border-color:var(--bc);color:var(--fc)}
.dotb.fut{opacity:.5}
.st{font-size:13px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}

/* year */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 18px}
.mo h4{margin:0 0 6px;font:italic 500 17px var(--serif);color:var(--t1);text-transform:capitalize}
.mo .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mo .g b{font:italic 500 10px var(--sans);color:var(--ink2);text-align:center}
.mo .g i{aspect-ratio:1;border:1.5px solid var(--ink2);border-radius:3px;display:block;opacity:.55}
.mo .g i.e{border:0;opacity:0}
.mo .g i.on{background:var(--deep);border-color:var(--deep);opacity:1}
.mo .g i.td{outline:2px solid var(--t1);outline-offset:1px;opacity:1}

/* habit manage */
.hm{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hm:first-of-type{border-top:0}
.sws{display:flex;gap:4px;flex-wrap:wrap}
.swb{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--bc);padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swb[aria-pressed="true"]{border-color:var(--ink)}
.autotag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:1px 8px}

/* challenges */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chp{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;text-align:left;min-width:128px;color:var(--ink)}
.chp b{display:block;font-weight:500;font-size:14px}
.chp small{color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.chp[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.chp[aria-pressed="true"] small{color:inherit;opacity:.85}
.chh{font:italic 500 clamp(30px,6vw,52px)/1.05 var(--serif);color:var(--t1);margin:0}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 8px;max-width:620px;margin:18px auto 4px}
.cw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cw small{font-size:12px;color:var(--ink2)}
.cir{width:100%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;font:italic 500 clamp(13px,3.2vw,18px) var(--sans);color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.cir.rest{border:1.5px dashed var(--t2);background:var(--soft);color:var(--ink2);font-size:clamp(10px,2.4vw,13px)}
.cir.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.cir.last{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--t1)}
.cir .ic{font-size:clamp(16px,4vw,24px)}
.arcwrap{display:none}
@media (min-width:760px){ .arcwrap{display:block} .gridwrap.alt{display:none} }
.arc{width:100%;max-width:640px;display:block;margin:6px auto}
.arc .node circle{fill:var(--paper);stroke:var(--ink2);stroke-width:1.6;opacity:.9}
.arc .node.rest circle{stroke-dasharray:3 3;stroke:var(--t2);fill:var(--soft)}
.arc .node.on circle{fill:var(--deep);stroke:var(--deep)}
.arc .node{cursor:pointer}
.arc .node .nn{font:italic 500 13px var(--sans);fill:var(--ink);text-anchor:middle}
.arc .node.on .nn{fill:var(--on-deep)}
.arc .node:focus-visible circle{stroke:var(--t1);stroke-width:3}
.arc .val{font:italic 500 15px var(--sans);fill:var(--ink)}
.arc .val.r{fill:var(--ink2);font-style:italic}
.arc .mid1{font:italic 500 54px var(--serif);fill:var(--t1);text-anchor:middle}
.arc .mid2{font:italic 400 17px var(--sans);fill:var(--ink2);text-anchor:middle;letter-spacing:.08em}

/* food */
.bigrow{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center}
.macros{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.macro{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:14px}
.macro .bar{height:9px}
.meal{border-top:1px solid var(--line);padding:10px 0}
.meal:first-of-type{border-top:0}
.ent{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.ent .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.ent .mt{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ent .kc{font-variant-numeric:tabular-nums;font-weight:500;min-width:62px;text-align:right}
.pre{display:flex;flex-wrap:wrap;gap:6px}
.pre .p{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;background:var(--paper);overflow:hidden}
.pre .p button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;text-align:left}
.pre .p button:hover{background:var(--soft)}
.pre .p .x{padding:6px 9px;color:var(--ink2);border-left:1px solid var(--line)}
.wk7{width:100%;height:auto;display:block}
.wk7 text{fill:var(--ink2);font:12px var(--sans)}
.wk7 .tl{stroke:var(--t1);stroke-dasharray:4 4;stroke-width:1.5}
.wk7 rect.b{fill:var(--c2)}
.wk7 rect.b.cur{fill:var(--deep)}

/* training */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wd{display:flex;flex-direction:column;gap:8px}
.wd .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wd .hd b{font:italic 500 19px var(--serif);color:var(--t1)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sd{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);display:flex;flex-direction:column;gap:6px;min-width:0}
.sd.today{border-color:var(--t1);box-shadow:0 0 0 1px var(--t1)}
.sd .dw{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.sd .wn{font:italic 500 15px/1.25 var(--sans);min-height:2.5em}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.prog div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.prog div.cur{background:var(--c0);color:var(--f0);border-color:transparent}
.prog b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}

/* progress charts */
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font:italic 500 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sp2{width:100%;height:auto;display:block}
.sp2 text{fill:var(--ink2);font:11px var(--sans)}
.sp2 .ln{fill:none;stroke:var(--deep);stroke-width:2;stroke-linejoin:round}
.sp2 .pt{fill:var(--paper);stroke:var(--deep);stroke-width:2}
.sp2 .gd{stroke:var(--line)}

/* footer palette */
.pal{margin:40px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.pal h2{font:italic 500 30px var(--serif);color:var(--t1);margin:0 0 10px}
.pal ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 26px}
.pal li{display:flex;align-items:center;gap:8px;font:italic 600 clamp(16px,3.6vw,24px) var(--sans);letter-spacing:.01em}
.pal li svg{width:1.2em;height:1.2em;fill:var(--sc);stroke:var(--sc);stroke-width:1.4;stroke-linejoin:round;filter:drop-shadow(0 0 .5px rgba(0,0,0,.35))}

@media (max-width:820px){ .cols{grid-template-columns:1fr} .macro{grid-template-columns:78px 1fr auto} }
@media (max-width:520px){ .card{padding:14px} .cell{padding:5px;min-height:72px} .grid7,.dowrow{gap:3px} .cell .pc{display:none} .hm{grid-template-columns:1fr auto} .hm .sws{grid-column:1/-1;order:3} }
@media (prefers-reduced-motion:no-preference){ .blk,.gl,.cir,.exrow{transition:background .15s,transform .1s} .blk:active,.cir:active{transform:scale(.98)} }
</style>

<script>
(function(){
'use strict';
const STANDALONE=true;
let authHook=null;
/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dow=k=>(parse(k).getDay()+6)%7;
const todayK=()=>iso(new Date());
const monday=k=>addD(k,-dow(k));
let LANG='ru';
let MN=[],MG=[],DL=[],DS=[];
function fillDates(){
  const L=LANG==='ru'?'ru':'en',U={timeZone:'UTC'};
  MN=[];MG=[];DL=[];DS=[];
  for(let i=0;i<12;i++){const d=new Date(Date.UTC(2021,i,15));
    MN.push(new Intl.DateTimeFormat(L,Object.assign({month:'long'},U)).format(d));
    const p=new Intl.DateTimeFormat(L,Object.assign({day:'numeric',month:'long'},U)).formatToParts(d).find(x=>x.type==='month');
    MG.push(p?p.value:MN[i]);}
  for(let i=0;i<7;i++){const d=new Date(Date.UTC(2021,0,4+i));
    DL.push(new Intl.DateTimeFormat(L,Object.assign({weekday:'long'},U)).format(d));
    DS.push(new Intl.DateTimeFormat(L,Object.assign({weekday:'short'},U)).format(d));}
}
fillDates();
const plural=(n,f)=>{if(LANG!=='ru')return Math.abs(n)===1?f[0]:f[2];n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?f[2]:m>1&&m<5?f[1]:m===1?f[0]:f[2]};
const nf=n=>Math.round(n).toLocaleString(LANG==='ru'?'ru-RU':'en-US');
const dateLong=k=>{const d=parse(k);return DL[dow(k)]+', '+d.getDate()+' '+MG[d.getMonth()]};
const uid=()=>Math.random().toString(36).slice(2,9);
const ic=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const cv=i=>'style="--bc:var(--c'+(i%8)+');--fc:var(--f'+(i%8)+')"';

/* ---------- themes ---------- */
const THEMES={
  gray:{name:'gray sky',tag:'Тихие серые облака над морем: спокойный ритм и ровные шаги.',colors:['#CBDFEA','#C8C2BC','#708090','#4B3935','#FAF3E0'],n:5},
  forest:{name:'rain forest',tag:'Лес полон жизни: зелёный, живой и всегда в движении.',colors:['#ADB6AB','#7E8A6D','#546A50','#D5DFD3','#394931'],n:5},
  waves:{name:'waves',tag:'Прыгай в волны: сила, вода и скорость.',colors:['#5493cb','#9bd9f0','#99f6ff','#b4c1ff','#aaceff','#3e59a1','#4e5c96','#4e7abf'],n:8},
  blush:{name:'blush',tag:'Мягко и упрямо: маленькие шаги и большие результаты.',colors:['#F7C9CF','#E8788A','#FCE4E6','#8B4A47','#D9A5A0'],n:5},
  sand:{name:'sand',tag:'Тёплый песок и спокойная дисциплина.',colors:['#E8D3C4','#C9A58F','#B58B73','#6D5646','#F3E0D3'],n:5}
};

/* ---------- content ---------- */
const PLANK=[20,20,30,30,30,40,null,40,40,50,50,50,60,null,60,60,60,60,60,60,null,70,70,80,80,80,90,90,null,100,100,100,110,110,110,null,120,130,140,140,150,150,160,170,180];
const PUSH=[5,5,5,7,10,10,10,12,15,null,15,17,20,20,20,22,22,25,null,25,25,27,27,30,null,30,32,32,32,35];
function gen(days,from,to,rest){const a=[];for(let i=0;i<days;i++){a.push(rest&&(i+1)%rest===0?null:Math.round(from+(to-from)*(days>1?i/(days-1):0)))}return a}
const BUILTIN=[
  {id:'plank',name:'Планка',sub:'45 дней, с нуля до 3 минут',fmt:'time',vals:PLANK,layout:'grid'},
  {id:'push',name:'Отжимания',sub:'30 дней, до 35 раз',fmt:'reps',vals:PUSH,layout:'arc'},
  {id:'squat',name:'Приседания',sub:'30 дней, 15 → 50',fmt:'reps',vals:gen(30,15,50,7),layout:'grid'},
  {id:'bridge',name:'Ягодичный мостик',sub:'30 дней, 15 → 45',fmt:'reps',vals:gen(30,15,45,7),layout:'grid'},
  {id:'abs',name:'Скручивания',sub:'30 дней, 15 → 45',fmt:'reps',vals:gen(30,15,45,7),layout:'grid'},
  {id:'boat',name:'Лодочка с отводом рук',sub:'30 дней, удержание 20 → 75 с',fmt:'sec',vals:gen(30,20,75,7),layout:'grid'},
  {id:'wall',name:'Стульчик у стены',sub:'30 дней, для лыж: 30 с → 2 мин',fmt:'time',vals:gen(30,30,120,7),layout:'grid'},
  {id:'balance',name:'Баланс на одной ноге',sub:'30 дней, на каждую ногу: 20 → 90 с',fmt:'sec',vals:gen(30,20,90,7),layout:'grid'},
  {id:'stretch',name:'Растяжка',sub:'21 день, 5 → 20 минут',fmt:'min',vals:gen(21,5,20,0),layout:'grid'}
];
const FMT={
  time:v=>pad(Math.floor(v/60))+':'+pad(v%60),
  reps:v=>String(v),
  min:v=>v+' мин',
  sec:v=>v+' с'

function norm(o){
  const d=defaults();o=o||{};

  r.goals=Object.assign(defaults().goals,o.goals||{});
  ['days','ch','active','refl'].forEach(k=>{if(!r[k]||typeof r[k]!=='object')r[k]=d[k]});
  ['habits','customCh','meas','foods','sched'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=d[k]});

/* ---------- persistence ---------- */
let remote=null,remoteTimer=null,remoteBusy=false,remoteDirty=false,remoteFails=0,failToasted=false;
function loadLocal(){try{return norm(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return defaults()}}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();persistLocal();queueRemote()}
function queueRemote(){remoteDirty=true;if(!remote||remoteFails>=3)return;clearTimeout(remoteTimer);remoteTimer=setTimeout(pushRemote,1200)}
async function pushRemote(){
  if(!remote||!remoteDirty||remoteFails>=3)return;
  if(remoteBusy){remoteTimer=setTimeout(pushRemote,1500);return}
  remoteBusy=true;remoteDirty=false;
  try{await remote.push(JSON.stringify(S),S.updatedAt);remoteFails=0}
  catch(e){
    remoteDirty=true;remoteFails++;
    if(remoteFails>=3){if(!failToasted){failToasted=true;toast('Не получилось сохранить в аккаунт. Данные пока остаются на этом устройстве.')}}
    else{clearTimeout(remoteTimer);remoteTimer=setTimeout(pushRemote,3000)}
  }
  remoteBusy=false;
}
function mergeRemote(r){
  const rt=(r&&r.updatedAt)||0,lt=S.updatedAt||0;
  if(rt>lt){S=norm(r);persistLocal();applyTheme();render()}
  else if(lt>rt){remoteDirty=true;pushRemote()}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=res[0],user=res[1];
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const ref=db.doc('data/users/'+id+'/state');
    const snap=await ref.get();
    remote={push:(json,ts)=>ref.set({json:json,updatedAt:ts})};
    let r=null;
    if(snap.exists){try{r=JSON.parse((snap.data()||{}).json)}catch(e){}}
    mergeRemote(r);
  }catch(e){}
}

function challengeDoneOn(k){for(const id in S.ch){const dn=S.ch[id].done||{};for(const n in dn){if(dn[n]===k)return true}}return false}
function tot(k){const t={kcal:0,p:0,f:0,c:0};peek(k).meals.forEach(m=>{t.kcal+=+m.kcal||0;t.p+=+m.p||0;t.f+=+m.f||0;t.c+=+m.c||0});return t}
function autoSync(k){
  const d=S.days[k];if(!d)return;
  const t=tot(k);
  const cond={workout:d.wk,water:d.water>=S.goals.water,steps:d.steps>=S.goals.steps,protein:t.p>=S.goals.protein,challenge:challengeDoneOn(k)};
  S.habits.forEach(h=>{
    if(!h.auto)return;
    const c=!!cond[h.auto];
    if(c&&!d.auto[h.id]){d.auto[h.id]=1;d.h[h.id]=true}
    else if(!c&&d.auto[h.id]){delete d.auto[h.id];d.h[h.id]=false}
  });
}

function isDone(h,k){return !!peek(k).h[h.id]}

function pct(k){return S.habits.length?Math.round(100*doneCount(k)/S.habits.length):0}
function workoutFor(k){const d=peek(k);return d.plan||S.sched[dow(k)]||''}
function streak(h){
  let k=todayK(),n=0;
  if(!isDone(h,k))k=addD(k,-1);
  while(isDone(h,k)){n++;k=addD(k,-1);if(n>2000)break}

}

  if(m.indexOf('already registered')>=0||m.indexOf('already been registered')>=0)return 'Эта почта уже зарегистрирована. Попробуй войти или сбросить пароль.';
  if(m.indexOf('not confirmed')>=0)return 'Почта ещё не подтверждена. Открой ссылку из письма, которое мы отправили при регистрации.';
  if(m.indexOf('at least')>=0&&m.indexOf('character')>=0)return 'Пароль слишком короткий. Нужно не меньше 8 символов.';
  if(m.indexOf('rate limit')>=0||m.indexOf('too many')>=0||m.indexOf('security purposes')>=0)return 'Слишком много попыток. Подожди минуту и попробуй снова.';
  if(m.indexOf('valid email')>=0||m.indexOf('invalid email')>=0)return 'Проверь адрес почты.';
  if(m.indexOf('same password')>=0)return 'Новый пароль должен отличаться от старого.';
  if(m.indexOf('failed to fetch')>=0||m.indexOf('network')>=0)return 'Нет связи с сервером. Проверь интернет.';

      const p1=v('a-pass'),p2=v('a-pass2');
      if(p1!==p2){authErr='Пароли не совпадают.';showAuth();return}
      const r=await SB.auth.updateUser({password:p1});
      if(r.error)throw r.error;
      recovering=false;
      try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
      const g=await SB.auth.getSession();
      toast('Пароль обновлён.');
      if(g.data.session)onSession(g.data.session);else{authView='login';showAuth()}
    }
  }catch(e){authErr=authErrRu(e);showAuth()}
}

Object.assign(A,{
  authView:d=>{authView=d.v;authErr='';showAuth()},
  signOut:async()=>{if(menuOpen)setMenu(false);try{await SB.auth.signOut()}catch(e){onSignedOut()}}
});
async function sbBoot(){
  const cfg=sbCfg();
  if(!cfg){authView='setup';showAuth();return}
  if(!window.supabase||!window.supabase.createClient){authView='setup';authErr='Не загрузилась библиотека входа. Проверь интернет и обнови страницу.';showAuth();return}
  recovering=/type=recovery/.test(location.hash);
  SB=window.supabase.createClient(cfg.url,cfg.key);
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;authView='recovery';showAuth();return}
    if(ev==='SIGNED_OUT'){setTimeout(onSignedOut,0);return}
    if(session&&!recovering)setTimeout(()=>onSession(session),0);
  });
  if(recovering){authView='recovery';showAuth();return}
  const r=await SB.auth.getSession();
  if(r.data.session)onSession(r.data.session);
  else{authView='login';showAuth()}
}

/* ---------- i18n ---------- */
const CYR=/[А-Яа-яЁё]/;
const LANGS=[['ru','Русский'],['en','English']];
const NUMRE=/\d+(?:[.,:]\d+)?/g,RUN=/[А-Яа-яЁё][А-Яа-яЁё ]*[А-Яа-яЁё]|[А-Яа-яЁё]/g;
function trStr(s){
  if(LANG==='ru')return s;
  const t=s.trim();if(!t||!CYR.test(t))return s;
  const d=I18N[LANG]||{};
  let r=d[t];
  if(r==null){
    const nums=t.match(NUMRE);
    if(nums){const k=t.replace(NUMRE,'#');if(d[k]!=null){let i=0;r=d[k].replace(/#/g,()=>(nums[i++]||'').replace(/(\d),(\d)/,'$1.$2'))}}
  }
  if(r==null){const rs=I18R[LANG]||[];for(let i=0;i<rs.length;i++){const m=t.match(rs[i][0]);if(m){r=rs[i][1].apply(null,m.slice(1).concat([trStr]));break}}}
  if(r==null){
    let ch=false;
    r=t.replace(RUN,m=>{const x=d[m];if(x!=null){ch=true;return x}return m.replace(/[А-Яа-яЁё]+/g,w=>{const y=d[w]!=null?d[w]:d[w.toLowerCase()];if(y!=null&&w.length>1){ch=true;return y}return w})});
    if(!ch)return s;
  }
  return s.slice(0,s.length-s.trimStart().length)+r+s.slice(s.trimEnd().length);
}
const TRATTR=['placeholder','aria-label','title','alt'];
function trNode(n){
  if(n.nodeType===3){
    const v=n.nodeValue,had=n.__o!==undefined,src=(had&&v===n.__t)?n.__o:v;
    if(!had&&!CYR.test(v))return;
    const out=trStr(src);if(out!==v)n.nodeValue=out;
    n.__o=src;n.__t=out;
  }else if(n.nodeType===1){
    const tg=n.tagName;if(tg==='SCRIPT'||tg==='STYLE')return;
    trAttrs(n);
    for(let c=n.firstChild;c;c=c.nextSibling)trNode(c);
  }
}
function trAttrs(n){
  TRATTR.forEach(a=>{
    if(!n.hasAttribute||!n.hasAttribute(a))return;
    const v=n.getAttribute(a),m=n.__a||(n.__a={}),p=m[a],src=(p&&v===p[1])?p[0]:v;
    if(!p&&!CYR.test(v))return;
    const out=trStr(src);if(out!==v)n.setAttribute(a,out);
    m[a]=[src,out];
  });
}
const i18nMO=new MutationObserver(ms=>{
  if(LANG==='ru')return;
  i18nMO.disconnect();
  try{ms.forEach(m=>{if(m.type==='characterData')trNode(m.target);else if(m.type==='attributes')trAttrs(m.target);else m.addedNodes.forEach(trNode)})}finally{i18nObs()}
});
function i18nObs(){i18nMO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TRATTR})}

  if(l===LANG)return false;
  LANG=l;fillDates();document.documentElement.lang=l;
  i18nMO.disconnect();trNode(document.body);i18nObs();
  return true;
}
